name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore CanvasDesktop.slnx --locked-mode
      - run: dotnet build CanvasDesktop.slnx -c Release --no-restore
      - run: dotnet test Tests/CanvasDesktop.Tests.csproj -c Release --no-build --no-restore --logger trx --collect "XPlat Code Coverage" --results-directory TestResults
      - run: dotnet publish CanvasDesktop.csproj -c Release --no-restore --self-contained false -o publish-ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results
          path: TestResults
          if-no-files-found: ignore
